# Postgres desechable para pruebas de integración. No apunta a ninguna base real.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: asistto
      POSTGRES_PASSWORD: asistto_test_only
      POSTGRES_DB: asistto_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistto -d asistto_test"]
      interval: 5s
      timeout: 5s
      retries: 10

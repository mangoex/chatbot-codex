name: CI

on:
  pull_request:
  push:
    branches:
      - "cursor/**"

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asistto
          POSTGRES_PASSWORD: asistto_test_only
          POSTGRES_DB: asistto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asistto -d asistto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://asistto:asistto_test_only@127.0.0.1:5432/asistto_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit==2.9.0

      - name: Lint ligero
        run: |
          ruff check --select E9,F63,F7 app tests
          python -m compileall -q app tests

      - name: Suite completa
        run: pytest tests --ignore=tests/bdd --ignore=tests/integration -q

      - name: BDD
        run: pytest tests/bdd -q

      - name: Integración
        run: pytest tests/integration -q

      - name: Cobertura
        # BDD e integración van en su propio proceso: unas pruebas antiguas
        # sustituyen fastapi y asyncpg al importarse y no sobreviven si otro
        # módulo cargó la librería real primero.
        run: pytest tests --ignore=tests/bdd --ignore=tests/integration -q --cov=app --cov-report=term-missing --cov-fail-under=58

      - name: Gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Dependencias (pip-audit)
        run: python scripts/ci/check_pip_audit.py
